    <!-- Content Security Policy — tightened in Tier 5 (fonts now self-hosted, no Google Fonts allowance):
         - Scripts: self + Lovable's gpteng CDN (script tagger). 'unsafe-inline'/'unsafe-eval' required by Vite/React in dev + some inline anti-flicker scripts.
         - Styles: self only. 'unsafe-inline' required by Tailwind/Radix runtime style injection.
         - Fonts: self only (Inter is bundled in /fonts/).
         - Images: self + data:/blob: (icons, OG previews) + https: (OG image on storage.googleapis.com, user avatars).
         - Connect: Supabase REST + Realtime WSS only.
         - Frames: none. Frame-ancestors 'none' = clickjacking protection (replaces X-Frame-Options for modern browsers).
         - Form-action: self only (lead capture posts to Supabase via fetch, not <form action>).
         - Base-uri: self (prevents <base> tag injection attacks). -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://cdn.gpteng.co https://*.daily.co; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; media-src 'self' blob: https://*.daily.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.vapi.ai https://*.vapi.ai wss://*.vapi.ai https://*.daily.co wss://*.daily.co https://*.pluot.blue wss://*.pluot.blue https://*.banuba.cloud; frame-src 'self' https://*.daily.co; frame-ancestors *; form-action 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests; report-uri https://hjqokvoaopvtapbllico.supabase.co/functions/v1/csp-report; report-to csp-endpoint;" />
    <meta http-equiv="Reporting-Endpoints" content='csp-endpoint="https://hjqokvoaopvtapbllico.supabase.co/functions/v1/csp-report"' />

    <!-- Additional security meta headers (those that work via <meta>; HSTS/X-Frame-Options/COOP must be set as HTTP headers at the hosting layer) -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Permissions-Policy" content='camera=(), microphone=(self "https://*.daily.co" "https://*.vapi.ai"), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=(), interest-cohort=()' />
